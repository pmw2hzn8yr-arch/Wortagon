<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Wabenwort</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#6b7280;--hex:#e5e4e2;--red:#bd2417;--bd:#d1d5db;--ok:#15803d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--fg:#f1f1f1;--mut:#9ca3af;--hex:#2e3036;--bd:#3f424a;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15161a;--fg:#f1f1f1;--mut:#9ca3af;--hex:#2e3036;--bd:#3f424a;--ok:#4ade80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
main{max-width:460px;margin:0 auto;padding:16px 18px 28px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:28px;letter-spacing:-.5px;display:flex;justify-content:space-between;align-items:baseline}
h1 button{font:14px system-ui,sans-serif;color:var(--mut);background:none;border:0;text-decoration:underline;padding:6px}
.prog{display:flex;align-items:center;gap:10px;font:600 15px system-ui,sans-serif}
.track{flex:1;display:flex;justify-content:space-between;align-items:center;position:relative}
.track:before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--bd)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--bd);position:relative}
.dot.on{background:var(--red)}
.score{min-width:34px;text-align:center;padding:5px 6px;background:var(--red);color:#fff;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);font:700 14px system-ui,sans-serif}
.input{border:1.5px solid var(--bd);border-radius:10px;min-height:52px;display:flex;align-items:center;justify-content:center;font:700 26px system-ui,sans-serif;letter-spacing:2px}
.input .c{color:var(--red)}.input .x{color:var(--mut)}
.ph{font:400 17px system-ui,sans-serif;color:var(--mut);letter-spacing:0}
.msg{height:22px;text-align:center;font:600 15px system-ui,sans-serif;color:var(--mut)}
.msg.good{color:var(--ok)}.msg.bad{color:var(--red)}
.comb{position:relative;width:260px;height:260px;margin:0 auto}
.hex{position:absolute;width:96px;height:83px;border:0;padding:0;background:var(--hex);color:var(--fg);font:700 34px system-ui,sans-serif;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);cursor:pointer;touch-action:manipulation}
.hex.mid{background:var(--red);color:#fff}
.hex:active{filter:brightness(.88)}
.ctl{display:flex;justify-content:center;gap:12px}
.ctl button{font:600 17px system-ui,sans-serif;color:var(--fg);background:none;border:1.5px solid var(--bd);border-radius:999px;height:48px;padding:0 26px;cursor:pointer}
.ctl button:active{background:var(--hex)}
.found h2{font:600 15px system-ui,sans-serif;margin:0 0 8px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{border:1px solid var(--bd);border-radius:6px;padding:4px 9px;font:15px system-ui,sans-serif}
.chips span.pan{border-color:var(--red);font-weight:700}
.dayn{font:14px system-ui,sans-serif;color:var(--mut)}
.goal{font:600 14px system-ui,sans-serif;color:var(--mut);margin-bottom:-6px}.goal.ok{color:var(--ok)}
.next{border:1.5px solid var(--bd);border-radius:10px;padding:12px;text-align:center;font:15px system-ui,sans-serif;color:var(--mut)}
.next b{display:block;margin-top:2px;font:700 26px system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--fg)}
</style>
</head>
<body>
<main>
  <h1><span>Wabenwort</span><span class="dayn" id="dayn"></span></h1>
  <div class="prog"><span id="cnt">0 Wörter</span><div class="track" id="track"></div><span class="score" id="score">0</span></div>
  <div class="goal" id="goal"></div>
  <div class="input" id="inp"></div>
  <div class="msg" id="msg"></div>
  <div class="comb" id="comb"></div>
  <div class="ctl"><button id="del" aria-label="Letzten Buchstaben löschen">Löschen</button><button id="mix" aria-label="Buchstaben mischen">Mischen</button><button id="ent">Enter</button></div>
  <div class="next">Nächstes Rätsel in <b id="cd">--:--:--</b></div>
  <div class="found"><h2 id="fh">Gefundene Wörter</h2><div class="chips" id="chips"></div></div>
</main>

const START=new Date(2026,9,26);   // Tag 1 = 26.10.2026 (lokale Zeit); ändern, um den Startpunkt zu verschieben
const TARGET=80,KEY="wabenwort:v1";
const $=id=>document.getElementById(id);
let P,words,found,cur,outer,day,t,tick;
const pts=w=>(w.length===4?1:w.length)+(new Set(w).size===7?10:0);
const dayNo=()=>{const n=new Date();return Math.floor((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-Date.UTC(START.getFullYear(),START.getMonth(),START.getDate()))/864e5)};
const store={
  get(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},
  set(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
};
function init(){
  day=dayNo();const i=((day%PUZ.length)+PUZ.length)%PUZ.length;const p=PUZ[i];
  P={c:p[0],o:p[1]};outer=p[1].split("");words=p[2];
  const s=store.get();found=s&&s.day===day?s.found.filter(w=>words.includes(w)):[];
  cur="";$("track").innerHTML='<i class="dot"></i>'.repeat(7);
  $("dayn").textContent="Rätsel Nr. "+(day+1);draw();say("");clock();
}
function draw(){
  const cx=130,cy=130,w=96,h=83,g=4;
  const pos=[[0,-(h+g)],[.75*w+g,-(h+g)/2],[.75*w+g,(h+g)/2],[0,h+g],[-.75*w-g,(h+g)/2],[-.75*w-g,-(h+g)/2]];
  const mk=(l,x,y,m)=>`<button class="hex${m?" mid":""}" style="left:${cx+x-w/2}px;top:${cy+y-h/2}px" data-l="${l}">${l}</button>`;
  $("comb").innerHTML=mk(P.c,0,0,1)+outer.map((l,i)=>mk(l,...pos[i])).join("");
  $("inp").innerHTML=cur?[...cur].map(l=>l===P.c?`<span class="c">${l}</span>`:`<span>${l}</span>`).join(""):'<span class="ph">Tippe auf die Buchstaben …</span>';
  const s=found.reduce((a,w)=>a+pts(w),0);
  $("score").textContent=s;$("cnt").textContent=found.length+(found.length===1?" Wort":" Wörter");
  [...$("track").children].forEach((d,i)=>d.classList.toggle("on",i>0&&s>=Math.ceil(TARGET*i/6)));
  $("goal").textContent=s>=TARGET?"Ziel von "+TARGET+" Punkten erreicht – du kannst weitersuchen.":"Ziel: "+TARGET+" Punkte";
  $("goal").className="goal"+(s>=TARGET?" ok":"");
  $("fh").textContent=`Gefundene Wörter (${found.length})`;
  $("chips").innerHTML=[...found].sort((a,b)=>a.localeCompare(b,"de")).map(w=>`<span${new Set(w).size===7?' class="pan"':""}>${w}</span>`).join("");
}
function clock(){
  clearInterval(tick);
  const upd=()=>{
    if(dayNo()!==day){init();return}
    const n=new Date(),nx=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),d=Math.max(0,Math.round((nx-n)/1000));
    const f=v=>String(v).padStart(2,"0");
    $("cd").textContent=`${f(Math.floor(d/3600))}:${f(Math.floor(d%3600/60))}:${f(d%60)}`;
  };
  upd();tick=setInterval(upd,1000);
}
function say(m,k){const e=$("msg");e.textContent=m;e.className="msg "+(k||"");clearTimeout(t);if(m)t=setTimeout(()=>say(""),2200)}
function add(l){if(cur.length<20){cur+=l;draw()}}
function back(){cur=cur.slice(0,-1);draw()}
function submit(){
  const w=cur;
  if(w.length<4)return say("Zu kurz – mindestens 4 Buchstaben","bad");
  if(!w.includes(P.c))return say("Der mittlere Buchstabe fehlt","bad");
  if(found.includes(w)){cur="";draw();return say("Schon gefunden","bad")}
  if(!words.includes(w))return say("Nicht in der Wortliste","bad");
  found.push(w);cur="";store.set({day,found});draw();
  say(new Set(w).size===7?`Isogramm! +${pts(w)} Punkte`:`+${pts(w)} Punkte`,"good");
}
function shuffle(){for(let i=outer.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[outer[i],outer[j]]=[outer[j],outer[i]]}draw()}
$("comb").addEventListener("click",e=>{const b=e.target.closest(".hex");if(b)add(b.dataset.l)});
$("del").onclick=back;$("mix").onclick=shuffle;$("ent").onclick=submit;
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="Enter")submit();else if(e.key==="Backspace")back();
  else if(/^[a-zA-Z]$/.test(e.key)){const l=e.key.toUpperCase();if(l===P.c||outer.includes(l))add(l)}
});
init();
